# Projected-ShapeNet-55: PCN + label-free AdaMemory, Mean--Std query.
optimizer: {
  type: Adam,
  kwargs: {lr: 0.0001, weight_decay: 0}
}
scheduler: {
  type: StepLR,
  kwargs: {step_size: 50, gamma: 0.5}
}

dataset: {
  train: {_base_: cfgs/dataset_configs/Projected_ShapeNet-55_noise.yaml,
          others: {subset: 'train'}},
  val: {_base_: cfgs/dataset_configs/Projected_ShapeNet-55_noise.yaml,
        others: {subset: 'test'}},
  test: {_base_: cfgs/dataset_configs/Projected_ShapeNet-55_noise.yaml,
         others: {subset: 'test'}}
}

model: {
  NAME: PCNAdaMemoryLabelFreeMeanStdQueryV1,
  num_pred: 8192,
  encoder_channel: 1024,
  memory_size: 250,
  evaluation_class_count: 55,
  not_similar_loss_num: 100,
  key_sim_loss_param: 0.0001,
  value_sim_loss_param: 1.0,
  get_sim_seperation_loss_param: 1.0,
  memory_circle_loss_m: 0.25,
  memory_circle_loss_gamma: 256,
  moment_token_eps: 0.00001,
  moment_token_layer_norm_affine: false,
  moment_token_mean_scale_init: 1.0,
  moment_token_std_scale_init: 1.0,
  memory_value_aggregation: legacy_max,
  encoder_config: {embed_dim: 256},
  decoder_config: {embed_dim: 256}
}

total_bs: 64
step_per_update: 1
max_epoch: 600
consider_metric: CDL1
